<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>📓</title><link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>* { box-sizing: border-box; margin: 0; padding: 0; }body {  background: #ffffff;  font-family: 'Nanum Gothic', 'Noto Sans KR', 'Gulim', 'Apple SD Gothic Neo', sans-serif;  color: #111111; min-height: 100vh;}
/* ══ 잠금 화면 ══ */#lock-screen {  position: fixed; inset: 0; background: #111111; z-index: 9999;  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;}#lock-screen.hidden { display: none; }.lock-icon { font-size: 40px; }.lock-subtitle { font-size: 13px; color: #666666; }.pin-dots { display: flex; gap: 18px; height: 24px; }.pin-dot { width: 15px; height: 15px; border-radius: 50%; background: #3a3a3a; transition: all 0.12s; }.pin-dot.filled { background: #ffffff; transform: scale(1.2); }.numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 248px; }.num-btn {  background: #1e1e1e; color: #ffffff; border: 1px solid #2e2e2e; border-radius: 10px;  font-size: 22px; padding: 18px 0; cursor: pointer; user-select: none; font-family: inherit;}.num-btn:active { background: #444444; transform: scale(0.95); }.num-btn.del-btn { font-size: 16px; color: #888888; }.lock-error { font-size: 12px; color: #ff6060; height: 16px; opacity: 0; transition: opacity 0.2s; }.lock-error.show { opacity: 1; }
/* ══ 메인 레이아웃 ══ */#app { display: none; }#app.visible { display: block; }
#header {  position: sticky; top: 0; z-index: 100; background: #ffffff;  border-bottom: 2px solid #111111; padding: 15px 20px;  box-shadow: 0 2px 8px rgba(0,0,0,0.07);  transition: transform 0.3s ease, padding 0.3s ease, opacity 0.2s;  transform-origin: top;}
#header-top { display: flex; flex-direction: column; gap: 12px; }#header-main-row { display: flex; align-items: flex-start; gap: 20px; width: 100%; }#app-title { font-size: 22px; padding-top: 4px; }
.memo-row { display: flex; gap: 15px; flex: 1; }.memo-wrap { flex: 1; display: flex; flex-direction: column; }.memo-label { font-size: 11px; color: #888888; font-weight: bold; margin-bottom: 5px; }
/* 📝 메모 상자 스타일 및 애니메이션 */.memo-box {  width: 100%; height: 216px !important; min-height: 216px !important;  background: #fcfcfc; border: 1.5px solid #333333; border-radius: 4px;  padding: 12px; font-family: inherit; font-size: 14px; line-height: 1.6;  resize: none; overflow-y: auto; outline: none; transition: height 0.2s ease, background-color 0.2s;}.memo-box:focus {   border-color: #1a5fa8;   background: #ffffff;   height: 320px !important;}
/* 🔍 버튼 목록 스타일 */.header-btns { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 130px; }
.hbtn {  border: none; border-radius: 4px; padding: 8px 12px; font-size: 12px;  font-family: inherit; cursor: pointer; text-align: center; font-weight: bold;  letter-spacing: 0.03em; transition: background 0.15s;}.hbtn:active { transform: scale(0.97); }.hbtn.green  { background: #1d7a45; color: #fff; }.hbtn.green:hover  { background: #155c33; }.hbtn.blue   { background: #1a5fa8; color: #fff; }.hbtn.blue:hover   { background: #134880; }.hbtn.gray   { background: #eee; color: #333; border: 1px solid #ccc; }.hbtn.gray:hover   { background: #ddd; }.hbtn.gold   { background: #7a5a1a; color: #fff; }.hbtn.gold:hover   { background: #5c4213; }.hbtn.purple { background: #563d7c; color: #fff; }.hbtn.purple:hover { background: #402d5e; }
/* 🔒 앱 잠금 하단 통합 검색박스 */.side-search-block {  background: #f4f4f4; border: 1.5px solid #333; border-radius: 4px;  padding: 6px; display: flex; flex-direction: column; gap: 6px;}.side-search-input {  width: 100%; padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px;  font-family: inherit; font-size: 12px; outline: none; background: #ffffff;}.side-search-input:focus { border-color: #1a5fa8; }.hbtn.search-btn {  background: #333; color: #fff; padding: 6px 0; font-size: 11px; width: 100%;}.hbtn.search-btn:hover { background: #000; }
/* ══ 공용 모달 ══ */.modal-overlay {  display: none; position: fixed; inset: 0; z-index: 9000;  background: rgba(0,0,0,0.55); align-items: center; justify-content: center;}.modal-overlay.open { display: flex; }.modal-box {  background: #fff; border-radius: 10px; padding: 28px 26px 22px;  max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.25); text-align: center;}.modal-icon  { font-size: 34px; margin-bottom: 10px; }.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }.modal-desc  { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 14px; }.modal-desc strong { color: #cc2222; }.modal-file-name {  font-size: 12px; color: #333; background: #f4f4f4; border-radius: 4px;  padding: 7px 10px; margin-bottom: 18px; word-break: break-all; text-align: left;}.modal-btns { display: flex; gap: 10px; }.modal-btn {  flex: 1; padding: 10px 0; border-radius: 6px; font-size: 14px;  font-family: inherit; cursor: pointer; font-weight: bold; border: none; transition: opacity 0.15s;}.modal-btn:hover { opacity: 0.85; }.modal-btn.cancel  { background: #eee; color: #444; }.modal-btn.primary { background: #1a5fa8; color: #fff; }.modal-btn.danger  { background: #b72828; color: #fff; }
/* ══ 비밀번호 변경 모달 ══ */#pw-modal .step { display: none; }#pw-modal .step.active { display: block; }.pw-step-label {  font-size: 12px; color: #888; margin-bottom: 14px;  display: flex; justify-content: center; gap: 8px;}.pw-step-label span { padding: 2px 8px; border-radius: 10px; background: #eee; color: #aaa; font-size: 11px; }.pw-step-label span.on { background: #1a5fa8; color: #fff; }.pw-pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }.pw-pin-dot { width: 13px; height: 13px; border-radius: 50%; background: #ddd; transition: all 0.12s; }.pw-pin-dot.filled { background: #1a5fa8; transform: scale(1.2); }.pw-numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }.pw-num-btn {  background: #f4f4f4; color: #111; border: 1px solid #ddd; border-radius: 8px;  font-size: 20px; padding: 14px 0; cursor: pointer; user-select: none; font-family: inherit;}.pw-num-btn:active { background: #ddd; transform: scale(0.95); }.pw-num-btn.del { font-size: 14px; color: #888; }.pw-error { font-size: 12px; color: #cc2222; height: 16px; opacity: 0; transition: opacity 0.2s; margin-bottom: 6px; }.pw-error.show { opacity: 1; }
/* ══ 테이블 ══ */#table-wrap { overflow: auto; max-height: calc(100vh - 250px); -webkit-overflow-scrolling: touch; transition: max-height 0.3s ease; }table { border-collapse: collapse; width: max-content; min-width: 100%; border: 2px solid #111111; }
/* 📅 헤더 셀 스타일 */thead th {  position: sticky; top: 0; z-index: 50; background: #f0f0f0;  border-bottom: 2px solid #111111; border-right: 1px solid #aaa; padding: 12px; font-size: 15px;}thead th:first-child { position: sticky; left: 0; z-index: 60; background: #e8e8e8; border-right: 2px solid #111111; }
/* 📅 날짜 셀 스타일 */td.date-cell {  position: sticky; left: 0; z-index: 10; background: #f4f4f4;  border-right: 2px solid #111111; border-bottom: 1px solid #ddd;  text-align: center; padding: 10px; width: 80px; cursor: pointer; transition: background 0.2s;}.date-cell:hover { background: #e8e8e8; }.date-label { font-size: 13px; font-weight: 700; display: block; }.sun .date-label { color: #cc2222; }.sat .date-label { color: #1a55bb; }
/* 📅 날짜 클릭 시 행(Row) 전체 높이 확장 */.day-row { transition: height 0.2s; }.day-row.expanded-row td {  height: 220px !important;  vertical-align: top;}
/* ✨✨ 연도 폴딩(접기) 관련 핵심 스타일 ✨✨ */th.year-col { cursor: pointer; transition: all 0.2s ease; }th.year-col:hover { background: #dcdcdc; }.year-title-text { transition: all 0.2s ease; display: block; }
/* 접혔을 때의 헤더(th) 모양 */th.collapsed-year {  width: 36px !important; min-width: 36px !important; max-width: 36px !important;  padding: 0 !important; background: #ebebeb;}th.collapsed-year:hover { background: #dfdfdf; }th.collapsed-year .year-title-text {  writing-mode: vertical-rl;  text-orientation: upright;  padding: 10px 0;  font-size: 13px;  letter-spacing: 2px;  margin: 0 auto;  color: #888;}
/* 접혔을 때의 데이터 칸(td) 모양 */td.entry-cell {  border-right: 1px solid #ccc; border-bottom: 1px solid #ccc;  vertical-align: top; width: 220px; cursor: text; transition: all 0.2s ease;}td.entry-cell.collapsed-year {  width: 36px !important; min-width: 36px !important; max-width: 36px !important;  padding: 0 !important; background: #f8f8f8; cursor: pointer; border-right: 1px dashed #ccc;}td.entry-cell.collapsed-year:hover { background: #eeeeee; }td.entry-cell.collapsed-year > * { display: none !important; }
.cell-text { display: block; padding: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; min-height: 60px; }.cell-text mark {  background-color: #ffeb3b;  color: #000000;  font-weight: bold;  padding: 1px 3px;  border-radius: 2px;}.cell-textarea { width: 100%; display: block; border: 2px solid #111111; padding: 10px; font-size: 14px; line-height: 1.6; resize: none; overflow: hidden; }.month-divider { background: #e0e0e0; cursor: pointer; }.month-divider td { padding: 10px; font-weight: 700; border-bottom: 2px solid #111111; }.collapsed-row { display: none; }
#toast {  position: fixed; bottom: 20px; right: 20px; background: #333; color: #fff;  padding: 10px 20px; border-radius: 30px; opacity: 0; transition: 0.3s;  pointer-events: none; z-index: 300; font-size: 14px;}#toast.show { opacity: 1; }
/* ══ 모바일 전용 반응형 스타일 ══ */@media (max-width: 768px) {  #header.hide-header {    transform: translateY(-100%);    opacity: 0;    pointer-events: none;    position: fixed;    width: 100%;  }  #header { padding: 10px; }  #header-main-row { flex-direction: column; gap: 10px; }  #app-title { display: none; }  .memo-row { width: 100%; flex-direction: column; gap: 8px; }  .memo-box { height: 120px !important; min-height: 120px !important; }  .memo-box:focus { height: 360px !important; }  .header-btns {     width: 100%;     display: grid;     grid-template-columns: repeat(2, 1fr);     gap: 6px;     min-width: unset;  }  .hbtn { padding: 10px 5px; font-size: 11px; }  #btn-toggle-years { grid-column: span 2; padding: 10px; }  .side-search-block { grid-column: span 2; width: 100%; padding: 8px; }  #table-wrap { max-height: calc(100vh - 350px); }  #table-wrap.fullscreen-table { max-height: 100vh !important; }  td.entry-cell { width: 160px; }  .cell-text { padding: 8px; font-size: 13px; min-height: 50px; }  .cell-textarea { padding: 6px; font-size: 13px; }  .day-row.expanded-row td { height: 320px !important; }  td.entry-cell.collapsed-year { width: 36px !important; min-width: 36px !important; }}</style></head><body>
